name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the release notes come from the annotated tag's
          # own message, and the fallback (commit list since the previous tag)
          # needs the previous tag to exist locally.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # D5: pinned — packaging behavior must not drift between releases
          pip install pyinstaller==6.22.2
          pip install pytest

      - name: Run tests
        env:
          # The suite is written offscreen (see tests docstrings). Without
          # this, Qt uses the runner's native platform and a delayed GC/
          # thread cleanup from an earlier widget test has crashed the
          # process mid-suite (access violation at ~test 73 on v1.8.1).
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Update version in build_config.py
        shell: bash
        run: |
          sed -i "s/^VERSION = .*/VERSION = \"${{ steps.version.outputs.VERSION }}\"/" build_config.py

      - name: Build exe with PyInstaller
        run: pyinstaller llama_cpp_launcher.spec

      - name: Verify exe exists
        run: |
          if (!(Test-Path "dist\LlamaCppLauncher.exe")) {
            Write-Error "Build failed: exe not found"
            exit 1
          }

      - name: Write release notes from the tag message
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Annotated tag (`git tag -a`) carries the release notes; write them out
          # verbatim. generate_release_notes is not usable here: it only lists
          # merged pull requests, and this repo pushes straight to main, so every
          # release body came out empty except for the compare link.
          #
          # The tag ref must be re-fetched on purpose. On a tag push checkout fetches
          # the *peeled commit* (that is what GITHUB_SHA is), and depending on how the
          # ref arrives locally it can end up pointing straight at the commit — the tag
          # object is the only place the message lives. This refspec stores the tag
          # object itself; --force because replacing a peeled ref is not a fast-forward.
          # (v1.9.1 fell through to the fallback with a perfectly good annotated tag on
          # the remote; the runner's git state is not readable from outside — job logs
          # need admin rights — hence the explicit fetch plus the diagnostics below.)
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG" \
            || echo "::warning::could not re-fetch refs/tags/$TAG; trying the local ref"

          # for-each-ref rather than `git tag -l --format`: -l takes a *pattern*, and
          # %(contents) on a lightweight tag returns the *commit* body, which would
          # silently ship as release notes. Check the object type instead.
          OBJTYPE="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')"
          NOTES=""
          if [ "$OBJTYPE" = "tag" ]; then
            NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')"
          fi
          echo "tag ref type: ${OBJTYPE:-<missing>}"
          echo "notes bytes : ${#NOTES}"

          if [ -n "$NOTES" ]; then
            # Drop a leading tag-name subject (GitHub renders the tag name itself, so
            # repeating it reads like a heading glitch) and the blank line after it.
            NOTES="$(printf '%s\n' "$NOTES" | awk -v tag="$TAG" '
              NR == 1 && $0 == tag { skip = 1; next }
              skip && $0 ~ /^[ \t]*$/ { next }
              { skip = 0; print }')"
            printf '%s\n' "$NOTES" > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            # Fallback for a lightweight tag: subject lines since the previous tag.
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')"
            {
              echo "### Changes in $TAG"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "$PREV..$TAG"
                echo
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
              else
                git log --no-merges -n 40 --pretty='- %s' "$TAG"
              fi
            } > RELEASE_NOTES.md
          fi

          echo "----- release notes -----"
          cat RELEASE_NOTES.md
          echo "---------------------------"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Llama CPP Launcher v${{ steps.version.outputs.VERSION }}"
          files: dist/LlamaCppLauncher.exe
          body_path: RELEASE_NOTES.md
          # Re-running a tag (fixing the notes, rebuilding the exe) must be
          # idempotent: without this the upload step fails on the asset name that
          # the previous run left behind, and the release keeps the stale binary.
          overwrite_files: true
          draft: false
          prerelease: false
