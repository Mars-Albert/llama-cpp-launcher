name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Re-publish a tag without rewriting it (fixing notes, rebuilding the exe). The
  # push trigger only fires on a tag creation, so without this the only way to
  # re-run a release is to delete and move the tag - which is what v1.9.1 needed
  # three times.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.9.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the release notes come from the annotated tag's
          # own message, and the fallback (commit list since the previous tag)
          # needs the previous tag to exist locally.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # D5: pinned — packaging behavior must not drift between releases
          pip install pyinstaller==6.22.2
          pip install pytest

      - name: Run tests
        env:
          # The suite is written offscreen (see tests docstrings). Without
          # this, Qt uses the runner's native platform and a delayed GC/
          # thread cleanup from an earlier widget test has crashed the
          # process mid-suite (access violation at ~test 73 on v1.8.1).
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Resolve the tag to publish
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Not a version tag: $TAG"; exit 1 ;;
          esac
          # A workflow_dispatch run checks out a branch, so the tag object has to be
          # fetched before anything can read its message. Verified in a clean clone:
          # this refspec stores the tag object itself (for-each-ref says "tag");
          # --force because replacing a peeled ref is not a fast-forward.
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG" \
            || echo "::warning::could not fetch refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from tag $TAG"

      - name: Update version in build_config.py
        shell: bash
        run: |
          sed -i "s/^VERSION = .*/VERSION = \"${{ steps.version.outputs.VERSION }}\"/" build_config.py

      - name: Build exe with PyInstaller
        run: pyinstaller llama_cpp_launcher.spec

      - name: Verify exe exists
        run: |
          if (!(Test-Path "dist\LlamaCppLauncher.exe")) {
            Write-Error "Build failed: exe not found"
            exit 1
          }

      - name: Write release notes from the tag message
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          NOTES=""
          SRC="none"
          # Annotated tag (`git tag -a`) carries the release notes; write them out
          # verbatim. generate_release_notes is not usable here: it only lists
          # merged pull requests, and this repo pushes straight to main, so every
          # release body came out empty except for the compare link.

          # Source 1: the local repo, if the tag object survived checkout.
          # for-each-ref rather than `git tag -l --format`: -l takes a *pattern*, and
          # %(contents) on a lightweight tag returns the *commit* body, which would
          # silently ship as release notes. Check the object type instead.
          LOCAL_TYPE="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)' 2>/dev/null)"
          if [ "$LOCAL_TYPE" = "tag" ]; then
            NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')"
            [ -n "$NOTES" ] && SRC="local-tag"
          fi
          echo "local refs/tags/$TAG: type=${LOCAL_TYPE:-<missing>} notes_bytes=${#NOTES}"

          # Source 2: the tag object as the *server* sees it. v1.9.1 fell through to the
          # fallback twice with a perfectly good annotated tag on the remote (verified
          # with git ls-remote, and an identical fetch verified in a clean clone), so
          # whatever checkout leaves under refs/tags/<tag> cannot be trusted - and the
          # runner's git state is unreadable from outside (job logs need admin rights).
          # This endpoint is one hop from the truth and GITHUB_TOKEN already has
          # contents:write.
          if [ -z "$NOTES" ]; then
            rm -f .ci_tag_type .ci_tag_notes.txt
            # setup-python exports GITHUB_PATH, so bash sees python too; the guard keeps
            # a missing interpreter from failing the whole release step.
            PY="$(command -v python || command -v python3 || echo '')"
            if [ -z "$PY" ]; then
              echo "::warning::no python on PATH; cannot read the tag message over the API"
            else
            GITHUB_TOKEN="${GITHUB_TOKEN:-}" GH_REPO="$GITHUB_REPOSITORY" GH_TAG="$TAG" "$PY" - <<'PY'
          import json, os, sys, urllib.request

          # The notes are CJK; a Windows console encoding (cp1252, cp936) would mangle
          # or reject anything printed.
          sys.stdout.reconfigure(encoding="utf-8")
          sys.stderr.reconfigure(encoding="utf-8")
          tok = os.environ.get("GITHUB_TOKEN") or ""
          repo = os.environ.get("GH_REPO") or ""
          tag = os.environ.get("GH_TAG") or ""
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "release-notes"}
          if tok:
              headers["Authorization"] = "Bearer " + tok


          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)


          # Written to files rather than stdout: the notes are CJK, and a Windows
          # console/stdout encoding (cp1252, cp936) would mangle or reject them.
          try:
              ref = get("https://api.github.com/repos/%s/git/ref/tags/%s" % (repo, tag))
              obj_type = ref["object"]["type"]
              with open(".ci_tag_type", "w", encoding="utf-8") as fh:
                  fh.write(obj_type)
              if obj_type != "tag":
                  # A lightweight tag has no message; the commit-list fallback is right.
                  sys.exit(0)
              message = get(ref["object"]["url"]).get("message") or ""
          except Exception as exc:  # noqa: BLE001 - never fail a release over notes
              print("::warning::tag message lookup over the API failed: %r" % exc,
                    file=sys.stderr)
              sys.exit(0)

          lines = message.splitlines()
          with open(".ci_tag_notes.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines).rstrip() + "\n")
          PY
            fi
            NOTES="$(cat .ci_tag_notes.txt 2>/dev/null || echo '')"
          fi

          if [ -n "$NOTES" ]; then
            # Drop a leading subject that only repeats the tag name (GitHub's own
            # "release notes from tag" UI does the same, and the page header already
            # shows it), with the blank line behind it. Pure bash: the sed this replaces
            # tried to re-test "line 1" after deleting it, which never happens - sed
            # numbers the input stream, so a leading blank line survived.
            NOTES="${NOTES//$'\r'/}"
            if [ "$NOTES" != "${NOTES#*$'\n'}" ] && [ "${NOTES%%$'\n'*}" = "$TAG" ]; then
              NOTES="${NOTES#*$'\n'}"
              while [ "$NOTES" != "${NOTES#*$'\n'}" ] && [ -z "${NOTES%%$'\n'*}" ]; do
                NOTES="${NOTES#*$'\n'}"
              done
            fi
            printf '%s\n' "$NOTES" > RELEASE_NOTES.md
            [ "$SRC" = "none" ] && SRC="api-tag"
          else
            SRC="fallback"
          fi
          API_TYPE="$(cat .ci_tag_type 2>/dev/null || echo '')"
          echo "notes source: $SRC | local ref type: ${LOCAL_TYPE:-<missing>} | api object type: ${API_TYPE:-<unknown>} | notes bytes: ${#NOTES}"

          if [ ! -s RELEASE_NOTES.md ]; then
            # Fallback for a lightweight tag: subject lines since the previous tag.
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')"
            {
              echo "### Changes in $TAG"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "$PREV..$TAG"
                echo
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
              else
                git log --no-merges -n 40 --pretty='- %s' "$TAG"
              fi
            } > RELEASE_NOTES.md
            # Self-diagnosing: job logs need admin rights, so leave the object types on
            # the release page itself. An HTML comment is invisible to readers, and one
            # look at the published body then pins the cause instead of another guess.
            printf '\n<!-- ci-diag: notes=%s local_ref=%s api_tag=%s -->\n' \
              "$SRC" "${LOCAL_TYPE:-missing}" "${API_TYPE:-missing}" >> RELEASE_NOTES.md
          fi

          echo "----- release notes -----"
          cat RELEASE_NOTES.md
          echo "---------------------------"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Llama CPP Launcher v${{ steps.version.outputs.VERSION }}"
          files: dist/LlamaCppLauncher.exe
          body_path: RELEASE_NOTES.md
          # Re-running a tag (fixing the notes, rebuilding the exe) must be
          # idempotent: without this the upload step fails on the asset name that
          # the previous run left behind, and the release keeps the stale binary.
          overwrite_files: true
          draft: false
          prerelease: false

      - name: Enforce the release body and prove it landed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ steps.version.outputs.TAG }}
        run: |
          # action-gh-release does send a body on update ("g = E || f"), and it wrote
          # ours on the first publish of v1.9.1 - but on the two re-runs for the same
          # tag it replaced the asset twice while the body stayed byte-identical to the
          # first run (the commit list still ended at that run's tip, 4 entries instead
          # of 5 and 6). Whatever its merge rule turns out to be, the body is ours:
          # PATCH it, then read it back and fail the run if it did not land.
          PY="$(command -v python || command -v python3 || echo '')"
          if [ -z "$PY" ]; then
            echo "::error::no python on PATH; cannot verify the release body"
            exit 1
          fi
          "$PY" - <<'PY'
          import json, os, sys, urllib.request

          sys.stdout.reconfigure(encoding="utf-8")
          tok = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GH_REPO"]
          tag = os.environ["GH_TAG"]
          api = "https://api.github.com/repos/" + repo
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "enforce-release-body",
          }
          if tok:
              headers["Authorization"] = "Bearer " + tok


          def call(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else {}


          want = open("RELEASE_NOTES.md", encoding="utf-8").read()
          rel = call("GET", api + "/releases/tags/" + tag)
          have = rel.get("body") or ""
          print("release id:", rel.get("id"), "| stored chars:", len(have),
                "| wanted chars:", len(want), flush=True)
          print("stored first line:", (have.splitlines() or [""])[0], flush=True)
          if have.strip() == want.strip():
              print("body already correct", flush=True)
              sys.exit(0)
          if not tok:
              sys.exit("body differs and GITHUB_TOKEN is empty; cannot PATCH it")

          call("PATCH", "%s/releases/%s" % (api, rel["id"]), {"body": want})
          back = call("GET", api + "/releases/tags/" + tag).get("body") or ""
          print("after PATCH, stored chars:", len(back), flush=True)
          print("file has ci-diag:", "ci-diag" in want, "| stored has ci-diag:",
                "ci-diag" in back, flush=True)
          if back.strip() != want.strip():
              print("stored first line:", (back.splitlines() or [""])[0], flush=True)
              # Only a difference in the HTML comment means GitHub strips comments from
              # stored release bodies - a real fact worth having, since the comment is
              # the fallback self-diagnostic. Say so instead of guessing about it.
              if back.strip() == want.split("<!--")[0].strip():
                  print("NOTE: everything matches except the trailing HTML comment",
                        flush=True)
              sys.exit("release body still differs from RELEASE_NOTES.md")
          print("body enforced: ok", flush=True)
          PY
